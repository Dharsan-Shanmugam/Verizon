<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Venue Intelligence | Executive Operations</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/executive.css">
</head>
<body class="executive-skin">
  <header class="shell-header">
    <a class="wordmark" href="#/forecast"><span class="brand-mark">V<span>.</span></span><span>VENUE<br><b>INTELLIGENCE</b></span></a>
    <nav id="nav" aria-label="Primary navigation">
      <a href="#/forecast" data-view="forecast">Forecast &amp; recommendations</a>
      <a href="#/live" data-view="live"><i class="live-dot"></i>Live operations</a>
    </nav>
    <div class="shell-meta"><span class="demo-badge" title="Synthetic data. No real network changes."><i class="simulation-dot"></i>SIMULATION</span><button class="icon-button" id="alerts-button" aria-label="Open notifications">!</button></div>
  </header>
  <main id="view" tabindex="-1"><div class="loading">Preparing intelligence...</div></main>
  <footer class="shell-footer"><span>Decision support. Human oversight. Simulated execution.</span><span id="asof"></span></footer>
  <dialog id="executive-dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" id="dialog-close" aria-label="Close dialog">&times;</button></div>
    <div id="dialog-body"></div><div id="dialog-actions"></div>
  </dialog>
  <aside id="investigation-panel" class="investigation-panel" role="dialog" aria-modal="false" aria-labelledby="investigation-title" tabindex="-1" hidden>
    <div class="investigation-header"><div><div class="eyebrow">LIVE INVESTIGATION</div><h2 id="investigation-title"></h2></div>
      <button class="icon-button" id="investigation-close" aria-label="Close investigation">&times;</button></div>
    <div id="investigation-content"></div>
  </aside>
  <div id="notifications" aria-live="polite"></div>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script src="js/executive.js"></script>
  <script src="js/views/executive-forecast.js"></script>
  <script src="js/views/executive-live.js"></script>
  <script>App.start();</script>
</body>
</html>
